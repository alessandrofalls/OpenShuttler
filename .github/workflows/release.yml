name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: swift test

      - name: Build Application and Create Release Packages (DMG & ZIP)
        run: ./build.sh --package

      - name: Update Homebrew Cask with release SHA-256
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 build/OpenShuttler-macOS-arm64.zip | awk '{print $1}')
          
          # Update version and sha256 in Casks/openshuttler.rb
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/openshuttler.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" Casks/openshuttler.rb

          # Commit updated cask back to main branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout -b main
          git add Casks/openshuttler.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(cask): bump openshuttler to ${VERSION} with automated sha256 [skip ci]"
            git push origin main
          fi

      - name: Generate Artifact Attestations (Sigstore Provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/OpenShuttler-macOS-arm64.dmg
            build/OpenShuttler-macOS-arm64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/OpenShuttler-macOS-arm64.dmg
            build/OpenShuttler-macOS-arm64.zip
            build/SHA256SUMS.txt
          name: OpenShuttler ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true


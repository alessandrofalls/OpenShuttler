name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: swift test

      - name: Build Application and Create Zip
        run: ./build.sh --zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/OpenShuttler-macOS-arm64.zip
          name: OpenShuttler ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

